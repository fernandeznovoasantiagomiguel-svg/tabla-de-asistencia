<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR Móvil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .movil-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .movil-container h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }

    .btn-camara {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      margin-top: 1rem;
      border-radius: 12px;
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 1.5rem;
      border-radius: 16px;
      overflow: hidden;
      border: 2px dashed rgba(168, 85, 247, 0.5);
    }

    .estado {
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 700;
    }

    .estado.ok { background: var(--success-gradient); color: #fff; }
    .estado.error { background: var(--danger-gradient); color: #fff; }
  </style>
</head>
<body>

  <div class="movil-container">
    <h2>📷 Lector QR Móvil</h2>
    <p style="color: var(--text-muted); margin-bottom: 1rem;">Apunta la cámara al carnet del estudiante</p>
    
    <button id="btnCamara" class="btn-camara" onclick="iniciarCamaraMovil()">Activar Cámara</button>
    <div id="reader"></div>
    <div id="estadoMovil" class="estado" style="display:none;"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    function fechaHoy() {
      const d = new Date();
      const aaaa = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${aaaa}-${mm}-${dd}`;
    }

    function horaAhora() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    let html5QrCode = null;

    function iniciarCamaraMovil() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccessMovil
      ).then(() => {
        document.getElementById("btnCamara").style.display = "none";
      }).catch(err => {
        alert("Ocurrió un error o faltan permisos de cámara.");
      });
    }

    function onScanSuccessMovil(codigoLeido) {
      const codigo = codigoLeido.trim().toUpperCase();
      const estado = document.getElementById("estadoMovil");
      estado.style.display = "block";

      // Obtener estudiantes guardados localmente
      const estudiantes = JSON.parse(localStorage.getItem("estudiantes")) || {};
      const est = estudiantes[codigo];

      if (!est) {
        estado.textContent = `❌ Estudiante no registrado (${codigo})`;
        estado.className = "estado error";
      } else {
        const fecha = fechaHoy();
        let asistencias = JSON.parse(localStorage.getItem("asistencias")) || [];

        // Verificar si ya registró asistencia hoy
        const yaRegistrado = asistencias.some(a => a.codigo === codigo && a.fecha === fecha);

        if (yaRegistrado) {
          estado.textContent = `⚠️ ${est.nombre} ya registró asistencia hoy.`;
          estado.className = "estado error";
        } else {
          const hora = horaAhora();
          
          // Agregar nueva asistencia
          asistencias.unshift({
            codigo: est.codigo,
            nombre: est.nombre,
            fecha: fecha,
            hora: hora
          });

          localStorage.setItem("asistencias", JSON.stringify(asistencias));

          estado.textContent = `✔ Marcado: ${est.nombre}`;
          estado.className = "estado ok";
        }
      }

      html5QrCode.pause(true);
      setTimeout(() => { 
        try { html5QrCode.resume(); } catch(e){} 
      }, 3000);
    }
  </script>
</body>
</html>
